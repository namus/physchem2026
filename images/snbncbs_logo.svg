<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1d3a"/>
      <stop offset="100%" stop-color="#071326"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <circle cx="200" cy="200" r="135" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Text Arc Path 1: Top -->
  <path id="textArcTop" d="M 40,200 A 160,160 0 1,1 360,200" fill="none"/>
  <!-- Text Arc Path 2: Bottom -->
  <path id="textArcBottom" d="M 360,200 A 160,160 0 0,1 40,200" fill="none"/>

  <text fill="#f8fafc" font-family="'Outfit', 'Inter', sans-serif" font-size="16.5" font-weight="700" letter-spacing="1.8">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      S. N. BOSE NATIONAL CENTRE FOR BASIC SCIENCES
    </textPath>
  </text>

  <text fill="url(#goldGrad)" font-family="'Outfit', 'Inter', sans-serif" font-size="14.5" font-weight="600" letter-spacing="2.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      • KOLKATA • ESTD. 1986 • DST GOVT OF INDIA •
    </textPath>
  </text>

  <!-- Center Artwork: Quantum Orbits, Bose Statistics Waves & Core Atom -->
  <g transform="translate(200, 200)">
    <!-- Orbits -->
    <ellipse cx="0" cy="0" rx="80" ry="28" fill="none" stroke="url(#tealGrad)" stroke-width="2.5" transform="rotate(30)" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="80" ry="28" fill="none" stroke="url(#tealGrad)" stroke-width="2.5" transform="rotate(-30)" opacity="0.85"/>
    <ellipse cx="0" cy="0" rx="80" ry="28" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" transform="rotate(90)" opacity="0.85"/>

    <!-- Orbit Electrons -->
    <circle cx="68" cy="38" r="5" fill="#fcd34d" filter="url(#glow)"/>
    <circle cx="-68" cy="38" r="5" fill="#2dd4bf" filter="url(#glow)"/>
    <circle cx="0" cy="-80" r="5.5" fill="#f59e0b" filter="url(#glow)"/>

    <!-- Center Nucleus / Symbol -->
    <circle cx="0" cy="0" r="26" fill="url(#goldGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="20" fill="#071326"/>
    
    <!-- Stylized SNB Monogram / Bose Symbol -->
    <text x="0" y="7" fill="url(#goldGrad)" font-family="'Outfit', 'Inter', serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="1">
      SNB
    </text>
  </g>
</svg>
